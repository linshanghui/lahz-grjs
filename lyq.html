<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留言墙</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f4f4f4;padding:16px}
.container{max-width:700px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px #00000015}
textarea,input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:8px 0;font-size:16px}
button{padding:10px 16px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;margin:4px}
button.del{background:#dc2626}
#msgList{margin-top:20px}
.msg-item{padding:12px;border-bottom:1px solid #eee;position:relative}
.msg-item .time{font-size:12px;color:#888;margin-top:4px}
.msg-item .del-btn{position:absolute;right:8px;top:8px}
.admin-area{margin-top:20px;padding:16px;background:#eff6ff;border-radius:12px}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h3>留言</h3>
    <input id="name" placeholder="昵称">
    <textarea id="content" rows="4" placeholder="写下留言"></textarea>
    <button onclick="submitMsg()">提交留言</button>
  </div>

  <div id="msgList"></div>

  <div class="admin-area">
    <h4>管理</h4>
    <button onclick="loadAllMsg()">刷新留言</button>
    <button onclick="openAdmin()">管理员入口</button>
  </div>
</div>

<script>
// ========== 这里已经修改为你正确的Worker地址 ==========
const API_URL = "https://spring-tree-e0ee.19519719512-a96.workers.dev";
// =======================================================

// 提交留言
async function submitMsg(){
  const name = document.getElementById('name').value.trim();
  const content = document.getElementById('content').value.trim();
  if(!name || !content){alert('昵称和内容不能为空');return;}
  const data = {name,content,time:new Date().toLocaleString()};
  try{
    const res = await fetch(`${API_URL}/?action=add`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });
    const ret = await res.json();
    if(ret.success){
      alert("留言成功");
      document.getElementById('name').value="";
      document.getElementById('content').value="";
      loadAllMsg();
    }else{
      alert(ret.msg||"提交失败");
    }
  }catch(e){
    alert("网络错误："+e.message);
  }
}

// 读取全部留言
async function loadAllMsg(){
  try{
    const res = await fetch(`${API_URL}/?action=list`);
    const list = await res.json();
    const wrap = document.getElementById('msgList');
    wrap.innerHTML="";
    list.forEach((item,idx)=>{
      const div = document.createElement('div');
      div.className="card msg-item";
      div.innerHTML=`
        <div><strong>${item.name}</strong></div>
        <div>${item.content}</div>
        <div class="time">${item.time}</div>
        <button class="del-btn del" onclick="delMsg(${idx})">删除</button>
      `;
      wrap.appendChild(div);
    })
  }catch(e){
    alert("读取留言失败："+e.message);
  }
}

// 删除留言
async function delMsg(index){
  if(!confirm("确定删除这条留言？"))return;
  try{
    const res = await fetch(`${API_URL}/?action=delete`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({index})
    });
    const ret = await res.json();
    if(ret.success){
      alert("已删除");
      loadAllMsg();
    }else{
      alert(ret.msg||"删除失败");
    }
  }catch(e){
    alert("删除失败："+e.message);
  }
}

function openAdmin(){
  const pwd = prompt("输入管理员密码");
  if(pwd === "admin123"){
    alert("登录成功");
    loadAllMsg();
  }else{
    alert("密码错误");
  }
}

window.onload = function(){
  loadAllMsg();
}
</script>
</body>
</html>
