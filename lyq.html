<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留言墙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5f7fa;color:#333;padding:20px;max-width:900px;margin:0 auto}
h1{text-align:center;margin-bottom:24px;font-size:28px}
.box{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px #00000012;margin-bottom:20px}
input,textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:12px;margin:8px 0;font-size:16px}
button{padding:10px 18px;border:none;border-radius:8px;background:#409eff;color:#fff;cursor:pointer;font-size:16px;margin:4px}
button:disabled{background:#a0cfff;cursor:not-allowed}
.msg-item{padding:14px;border-bottom:1px solid #eee}
.msg-name{font-weight:bold;color:#222}
.msg-time{color:#888;font-size:13px;margin:4px 0}
.msg-content{margin-top:6px;line-height:1.6}
.operate{text-align:right;margin-top:10px}
</style>
</head>
<body>
<h1>留言墙</h1>
<div class="box">
  <input type="text" id="nick" placeholder="你的昵称">
  <textarea id="content" rows="4" placeholder="写下留言"></textarea>
  <button id="submitBtn">提交留言</button>
</div>
<div class="box" id="msgList"></div>

<script>
// ========== 自定义域名接口 ==========
const WORKER_URL = "https://lyq.lahz.cn";
let config = {};
let msgList = [];
let lastSendTime = 0;

// 初始化
(async function init(){
  await loadConfig();
  await loadMsg();
  renderMsg();
})();

// 读取配置
async function loadConfig(){
  const res = await fetch(`${WORKER_URL}/msg_config.json`);
  config = await res.json();
}

// 读取留言
async function loadMsg(){
  const res = await fetch(`${WORKER_URL}/msg_data.json`);
  msgList = await res.json();
}

// 保存留言
async function saveMsg(){
  await fetch(`${WORKER_URL}/msg_data.json`,{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(msgList)
  })
}

// 渲染留言列表
function renderMsg(){
  const wrap = document.getElementById("msgList");
  wrap.innerHTML = "";
  msgList.slice().reverse().forEach(item=>{
    const div = document.createElement("div");
    div.className="msg-item";
    div.innerHTML=`
      <div class="msg-name">${htmlEscape(item.nick)}</div>
      <div class="msg-time">${item.time}</div>
      <div class="msg-content">${htmlEscape(item.content)}</div>
    `;
    wrap.appendChild(div);
  })
}

// HTML转义防XSS
function htmlEscape(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

// 提交留言
document.getElementById("submitBtn").onclick = async function(){
  const now = Date.now();
  const btn = this;
  const nick = document.getElementById("nick").value.trim();
  const content = document.getElementById("content").value.trim();

  // 冷却判断
  if(now - lastSendTime < config.cooldown *1000){
    alert(`冷却中，请等待${config.cooldown}秒`);
    return;
  }
  if(nick.length <1 || nick.length>config.nickMaxWords){
    alert(`昵称长度1~${config.nickMaxWords}`);return;
  }
  if(content.length < config.minWords || content.length>config.maxWords){
    alert(`留言长度${config.minWords}-${config.maxWords}字`);return;
  }

  // 敏感词过滤
  const badWords = config.badWords.split("\n").filter(x=>x.trim());
  for(let w of badWords){
    if(content.includes(w) || nick.includes(w)){
      alert("包含违禁词");return;
    }
  }

  btn.disabled = true;
  lastSendTime = now;
  const time = new Date().toLocaleString();
  msgList.push({nick,content,time});
  await saveMsg();
  await loadMsg();
  renderMsg();
  document.getElementById("content").value = "";
  btn.disabled = false;
  alert("留言成功");
}
</script>
</body>
</html>
